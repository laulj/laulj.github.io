name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# GITHUB_TOKEN needs `pages: write` to publish and `id-token: write` for the OIDC
# handshake deploy-pages uses; `contents: read` is all the checkout needs.
permissions:
    contents: read
    pages: write
    id-token: write

# Let a deploy in flight finish rather than cancelling it halfway through publishing.
# A queued run behind it is cheaper than a half-updated site.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  # Requires pnpm to be on PATH already, which is why the step above comes first.
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # Nothing reaches Pages unless it formats and passes. The provenance tests in
            # particular are load-bearing: they are what stops an unsourced number being
            # published, so a failure here must not be a warning.
            - name: Check formatting
              run: pnpm format:check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  # dist/ is what Pages serves. The two resumes and the degree certificate
                  # live in public/ and are copied into dist/ verbatim, which is what keeps
                  # their existing live URLs working.
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4

            # The first version of this job reported success while the live site was
            # serving the repository root instead of this artifact: a Vite entry, handed
            # over as application/octet-stream, so the browser refused the module and the
            # page rendered nothing. Every step was green and the site was broken. A
            # deployment nobody observes is not a deployment, so this reads the published
            # site back and fails the run if it is not the built app.
            - name: Smoke-check the published site
              run: |
                  set -euo pipefail
                  url="${{ steps.deployment.outputs.page_url }}"

                  # Cache-bust so this reads the origin rather than a CDN copy, and retry
                  # because the edge can lag a few seconds behind the deployment.
                  html=""
                  for attempt in $(seq 1 8); do
                      html=$(curl -fsS "${url}?cb=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)
                      echo "$html" | grep -q '/assets/index-' && break
                      echo "attempt ${attempt}: homepage is not the built app yet"
                      sleep 10
                  done
                  echo "$html" | grep -q '/assets/index-' || {
                      echo "::error::homepage is not the built app - is Pages still serving the branch root?"
                      exit 1
                  }

                  # A module script only runs if the server calls it JavaScript. That MIME
                  # mismatch is exactly what broke when Pages served the Vite entry.
                  asset=$(echo "$html" | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
                  ctype=$(curl -fsSI "${url%/}${asset}" | tr -d '\r' | awk 'tolower($1) == "content-type:" { print $2 }')
                  case "$ctype" in
                      *javascript*) echo "asset served as $ctype" ;;
                      *)
                          echo "::error::$asset served as ${ctype:-nothing}, not JavaScript"
                          exit 1
                          ;;
                  esac

                  # Everything in public/ is copied into dist/ verbatim, so these live URLs
                  # all have to survive a deploy: the two resumes, the degree certificate,
                  # and og.png, which is what makes a shared link render as a card rather
                  # than a bare URL.
                  for file in Web3_Developer_Lau_Lok_Jing.pdf Junior_Developer_Lau_Lok_Jing.pdf EEBachelorDegCertificate.pdf og.png; do
                      code=$(curl -sS -o /dev/null -w '%{http_code}' "${url%/}/${file}")
                      if [ "$code" != "200" ]; then
                          echo "::error::${file} returned ${code}"
                          exit 1
                      fi
                      echo "${file} -> 200"
                  done

                  # dist/ has no public/ directory, so this path disappearing is the
                  # clearest single sign that the artifact replaced the branch build.
                  code=$(curl -sS -o /dev/null -w '%{http_code}' "${url%/}/public/Web3_Developer_Lau_Lok_Jing.pdf")
                  if [ "$code" != "404" ]; then
                      echo "::error::still serving the branch build (/public returned ${code})"
                      exit 1
                  fi

                  echo "published site verified"
